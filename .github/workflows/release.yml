name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-pack-distribution-next
  cancel-in-progress: false
jobs:
  fast:
    name: Fast gate
    uses: ./.github/workflows/fast.yml
  native:
    name: Native
    needs: fast
    uses: ./.github/workflows/native.yml
  security:
    name: Security
    needs: fast
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      skip-dependencies: true
  release:
    name: Release
    needs: [fast, native, security]
    if: github.repository == 'Aliaksie/engineering-pack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version and changelog
        id: version
        run: node tooling/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check
        run: npm run check
      - name: Add native runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
        run: |
          for runner in ubuntu-latest macos-latest windows-latest; do
            gh run download "$GITHUB_RUN_ID" --name "native-${runner}-${GITHUB_SHA}" --dir .eval-results/native
          done
          node tooling/native-release.mjs .eval-results/native .eval-results/release
          for target in claude codex cursor copilot gemini agents gemini-extension jetbrains distribution; do
            node tooling/native-install.mjs .eval-results/native "dist/$target"
          done
      - name: Archive distributions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
        run: |
          mkdir -p .eval-results/release
          for target in claude codex cursor copilot gemini agents gemini-extension jetbrains distribution; do
            tar -czf ".eval-results/release/engineering-pack-${RELEASE_VERSION}-${target}.tar.gz" -C "dist/${target}" .
          done
          printf 'Version: %s\nSource: %s\nRelease revision: %s\n' "$RELEASE_VERSION" "$GITHUB_SHA" "$RELEASE_REVISION" > .eval-results/release/PROVENANCE.txt
          node tooling/release-notes.mjs "$RELEASE_VERSION" .eval-results/release-notes.md
          printf '\n' >> .eval-results/release-notes.md
          cat .eval-results/release/PROVENANCE.txt >> .eval-results/release-notes.md
          cd .eval-results/release
          sha256sum ./*.tar.gz native-release.json PROVENANCE.txt > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .eval-results/release/*
      - name: Publish tag
        run: node tooling/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
      - name: Publish distribution-next
        run: node tooling/publish-distribution.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REVISION: ${{ steps.version.outputs.revision }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ steps.version.outputs.revision }}
        run: |
          gh release create "v${RELEASE_VERSION}" --verify-tag --draft --title "Craft Capabilities ${RELEASE_VERSION}" --notes-file .eval-results/release-notes.md
          gh release upload "v${RELEASE_VERSION}" .eval-results/release/*
          gh release view "v${RELEASE_VERSION}" --json assets --jq '.assets | length' > .eval-results/release-asset-count
          test "$(cat .eval-results/release-asset-count)" = 15
          gh release edit "v${RELEASE_VERSION}" --draft=false
      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-recovery-${{ github.sha }}
          path: |
            .eval-results/release/
            .eval-results/release-notes.md
          if-no-files-found: ignore
          retention-days: 14
