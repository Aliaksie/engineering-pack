name: Fast gate

on:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_INCREMENTAL: '0'

jobs:
  sources:
    name: Sources and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate sources
        run: npm run validate
      - name: Check generated guidance
        run: npm run check:craft-bar
      - name: Lint scripts
        run: npm run lint:scripts
      - name: Build exports
        run: npm run build
      - name: Build distribution
        run: npm run build:distribution
      - name: Check architecture
        run: npm run architecture
      - name: Validate exports
        run: npm run validate:exports

  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  minimum-rust:
    name: Minimum Rust (1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  workflows:
    name: Workflows
    uses: ./.github/workflows/workflows.yml

  dependencies:
    name: Dependencies
    uses: ./.github/workflows/dependencies.yml
