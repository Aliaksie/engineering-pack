name: Installed hosts

# Release-only: every host's registered hook command, run from its installed export under the
# shells that host uses on each OS. Answers are checked against the runtime; timings are reported.
# Pull requests run it only when the smoke itself changes.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/benchmarks/hosts.mjs
      - .github/benchmarks/fixture.mjs
      - .github/workflows/hosts.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Installed hosts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      HYPERFINE_VERSION: '2.0.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Set up Rust
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache Hyperfine
        id: hyperfine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hyperfine
          key: hyperfine-${{ runner.os }}-${{ env.HYPERFINE_VERSION }}-${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install Hyperfine
        if: steps.hyperfine.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install hyperfine --version "$HYPERFINE_VERSION" --locked --root "$RUNNER_TEMP/hyperfine"
      - name: Build installed exports
        # Every host export with the release executable for this runner.
        shell: bash
        run: |
          cargo fetch --locked
          npm run build
          npm run build:native
          for host in claude codex cursor copilot gemini; do
            node tooling/native-install.mjs dist/project-evidence "dist/$host" --current-target
          done
      - name: Smoke and time
        shell: bash
        run: node .github/benchmarks/hosts.mjs --dist dist --output host-results --hyperfine "$RUNNER_TEMP/hyperfine/bin/hyperfine"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-hosts-${{ matrix.os }}-${{ github.sha }}
          path: host-results/
          if-no-files-found: error
          retention-days: 90
