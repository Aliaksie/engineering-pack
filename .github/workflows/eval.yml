name: Engineering eval

# Pull requests that change the eval only qualify its tasks without a model. Model-backed
# jobs run on manual dispatch, because every trial calls a paid model. Harbor's usage
# statistics stay off and no result leaves the run except the retained artifact.
on:
  pull_request:
    paths:
      - evals/**
      - .github/workflows/eval.yml
  workflow_dispatch:
    inputs:
      job:
        description: Harbor job configuration under evals/jobs
        type: choice
        default: diagnose
        options: [qualify, diagnose, compare]
      attempts:
        description: Trials per task and arm (repetitions)
        type: number
        default: 1
      tasks:
        description: Task directories under evals/tasks to run, as a glob (for example pi-*)
        type: string
        default: '*'

permissions:
  contents: read

concurrency:
  group: engineering-eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: Eval (${{ inputs.job || 'qualify' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      HARBOR_VERSION: '0.25.0'
      HARBOR_TELEMETRY: 'off'
      JOB: ${{ inputs.job || 'qualify' }}
      ATTEMPTS: ${{ inputs.attempts || 1 }}
      TASKS: ${{ inputs.tasks || '*' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Set up Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build Codex export with the native runtime
        run: |
          cargo fetch --locked
          npm run build:codex
          npm run build:native
          node tooling/native-install.mjs dist/project-evidence dist/codex --current-target
      - name: Build trial image
        run: docker build --file evals/image/Dockerfile --tag craft-eval:local .
      - name: Install Harbor
        run: pipx install "harbor==$HARBOR_VERSION"
      - name: Lint tasks
        # The trial image is built locally above, so it has no registry digest to pin.
        run: harbor lint --select ALL --ignore unpinned-image evals/tasks/*/
      - name: Qualify tasks
        # The oracle's reference solution must pass every task and an idle agent must fail it.
        run: |
          harbor run --config evals/jobs/qualify.yaml --job-name "qualify-$GITHUB_RUN_ID" --yes
          jq -r 'select(.trial_name) | "\(.task_name) \(.agent_info.name) reward=\(.verifier_result.rewards.reward // "none") \(.exception_info.exception_type // "")"' \
            .eval-results/harbor/"qualify-$GITHUB_RUN_ID"/*/result.json
          jq -s -e '[.[] | select(.trial_name)] as $trials | ($trials | length) > 0 and all($trials[];
            .exception_info == null and .verifier_result.rewards.reward == (if .agent_info.name == "oracle" then 1 else 0 end))' \
            .eval-results/harbor/"qualify-$GITHUB_RUN_ID"/*/result.json >/dev/null
      - name: Run
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'qualify'
        env:
          OPENAI_API_KEY: ${{ secrets.CRAFT_CODEX_API_KEY }}
        run: harbor run --config "evals/jobs/$JOB.yaml" --job-name "$JOB-$GITHUB_RUN_ID" --n-attempts "$ATTEMPTS" --path evals/tasks --include-task-name "$TASKS" --yes
      - name: Check results for the key
        id: leak
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.CRAFT_CODEX_API_KEY }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]] && grep -rqF -- "$OPENAI_API_KEY" .eval-results/harbor; then
            echo "::error::The API key appears in the results; they are not uploaded."
            exit 1
          fi
      - name: Summarize
        if: always() && steps.leak.outcome == 'success' && env.JOB != 'qualify'
        run: |
          # A run that failed before any trial still gets a summary, not a second failure.
          shopt -s nullglob
          {
            echo "### $JOB ($ATTEMPTS per task and arm, tasks $TASKS)"
            echo
            echo "| Task | Arm | Reward | Expected skill | Craft events | Lookups | Plan | Hook ms | Model steps | Tool calls | Shell searches | Input tokens | Cached | Output tokens | Cost USD | Agent seconds | Error |"
            echo "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|"
            for result in .eval-results/harbor/"$JOB-$GITHUB_RUN_ID"/*/result.json; do
              trajectory="$(dirname "$result")/agent/trajectory.json"
              # Model steps, tool calls and shell searches from the trajectory; unknown without one.
              agent='{"steps":"—","tools":"—","searches":"—"}'
              [[ -f "$trajectory" ]] && agent=$(jq -c '{
                steps: (.final_metrics.total_steps // ([.steps[]? | select(.source == "agent")] | length)),
                tools: ([.steps[]?.tool_calls[]?] | length),
                searches: ([.steps[]?.tool_calls[]?.arguments | tostring
                  | select(test("(^|[^A-Za-z_])(rg|grep|egrep|find|fd|ag) "))] | length)}' "$trajectory")
              jq -r --argjson agent "$agent" 'select(.trial_name) | .verifier_result.rewards as $r | [
                .task_name,
                (.config.agent.kwargs.config // "—" | split("/") | last | rtrimstr(".toml")),
                ($r.reward // "—"),
                ($r.expected_skill_selected // "—"),
                ($r.craft_events // "—"),
                ($r.craft_lookups // "—"),
                ($r.craft_plan_created // "—"),
                ($r.craft_hook_ms_total // "—"),
                $agent.steps, $agent.tools, $agent.searches,
                (.agent_result.n_input_tokens // "—"),
                (.agent_result.n_cache_tokens // "—"),
                (.agent_result.n_output_tokens // "—"),
                (.agent_result.cost_usd // "—"),
                (if .agent_execution.started_at and .agent_execution.finished_at
                  then ((.agent_execution.finished_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdate)
                      - (.agent_execution.started_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdate))
                  else "—" end),
                (.exception_info.exception_type // "")
              ] | map(tostring) | "| " + join(" | ") + " |"' "$result"
            done
            echo
            echo "Unknown values show as —; a cost the host does not report stays unknown, never 0. Each trial's verifier/reward.json holds the task-specific values. Browse every trial with \`harbor view jobs\` after downloading the artifact."
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ inputs.job }}-${{ github.run_id }}
          path: .eval-results/harbor/
          if-no-files-found: error
          retention-days: 90
