name: CI

on:
  push:
    branches-ignore: [distribution]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '20'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Validate manifests, catalog and content audit
        run: npm run validate
      - name: Check generated guidance
        run: npm run check:craft-bar
      - name: Lint portable scripts
        run: npm run lint:scripts
      - name: Build all host packages
        run: npm run build
      - name: Assemble direct-install distribution
        run: npm run build:distribution
      - name: Validate generated exports
        run: npm run validate:exports
      - name: Run tests
        run: npm run test:unit
      - name: Measure local hook diagnostics
        run: npm run hooks:report -- --output .eval-results/hook-report.json
      - name: Upload hook diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-diagnostics-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: .eval-results/hook-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package host bundles
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build packages
        run: |
          npm run build
          npm run build:distribution
      - name: Validate package output
        run: npm run validate:exports
      - name: Upload host bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-capabilities-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub installation branch
    needs: [check, package]
    if: github.repository == 'Aliaksie/engineering-pack' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: engineering-pack-distribution
      cancel-in-progress: false
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build installation branch
        run: npm run build:distribution
      - name: Publish generated files
        run: node scripts/publish-distribution.mjs
        env:
          GH_TOKEN: ${{ github.token }}
