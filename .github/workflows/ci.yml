name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native
    uses: ./.github/workflows/native.yml

  workflows:
    name: Workflows
    uses: ./.github/workflows/workflows.yml

  security:
    name: Security
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  check:
    name: Check (${{ matrix.label }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Same pin as native.yml; tests run the craft executable.
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux, node: '24' }
          - { os: macos-latest, label: macos, node: '24' }
          - { os: windows-latest, label: windows, node: '24' }
          - { os: ubuntu-latest, label: linux, node: '22' }
          - { os: ubuntu-latest, label: linux, node: '26' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Validate sources
        run: npm run validate
      - name: Check generated guidance
        run: npm run check:craft-bar
      - name: Lint scripts
        run: npm run lint:scripts
      - name: Build exports
        run: npm run build
      - name: Build distribution
        run: npm run build:distribution
      - name: Check architecture
        run: npm run architecture
      - name: Validate exports
        run: npm run validate:exports
      - name: Install Rust
        # Windows runners default to PowerShell, which would expand "$RUSTUP_TOOLCHAIN" to ''.
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          # Dependencies dominate build time; the lockfile key saves once per dependency set.
          key: cargo-check-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Test
        run: npm run test:unit
      - name: Hook report
        if: matrix.node == '24'
        run: npm run hooks:report -- --output .eval-results/hook-report.json
      - name: Upload hook report
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-diagnostics-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: .eval-results/hook-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package
    permissions:
      contents: read
      actions: read
    needs: [check, workflows, native, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build exports
        run: |
          npm run build
          npm run build:distribution
      - name: Add native runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for runner in ubuntu-latest macos-latest windows-latest; do
            gh run download "$GITHUB_RUN_ID" --name "native-${runner}-${GITHUB_SHA}" --dir .eval-results/native
          done
          for target in claude codex cursor copilot gemini agents gemini-extension jetbrains distribution; do
            node tooling/native-install.mjs .eval-results/native "dist/$target"
          done
      - name: Validate exports
        run: npm run validate:exports
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-capabilities-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [check, package]
    if: github.repository == 'Aliaksie/engineering-pack' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: engineering-pack-distribution-next
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "craft-capabilities-${GITHUB_SHA}" --dir dist
      - name: Publish distribution-next
        run: node tooling/publish-distribution.mjs
        env:
          GH_TOKEN: ${{ github.token }}
