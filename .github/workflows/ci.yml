name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast gate
    uses: ./.github/workflows/fast.yml

  native:
    name: Native
    needs: fast
    uses: ./.github/workflows/native.yml

  security:
    name: Security
    needs: fast
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      skip-dependencies: true

  linux-runtime:
    name: Linux test runtime
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-check-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Build test runtime
        run: cargo build --locked --package craft-application --bin craft
      - name: Upload test runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-runtime-${{ github.sha }}
          path: target/debug/craft
          if-no-files-found: error
          retention-days: 1

  check:
    permissions:
      contents: read
      actions: read
    name: Check (linux, Node ${{ matrix.node }})
    needs: [fast, linux-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRAFT_NATIVE_BINARY: ${{ github.workspace }}/.eval-results/test-runtime/craft
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Validate sources
        run: npm run validate
      - name: Check generated guidance
        run: npm run check:craft-bar
      - name: Lint scripts
        run: npm run lint:scripts
      - name: Build exports
        run: npm run build
      - name: Build distribution
        run: npm run build:distribution
      - name: Check architecture
        run: npm run architecture
      - name: Validate exports
        run: npm run validate:exports
      - name: Download test runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "linux-test-runtime-${GITHUB_SHA}" --dir .eval-results/test-runtime
      - name: Restore executable permission
        run: chmod +x "$CRAFT_NATIVE_BINARY"
      - name: Test
        run: npm run test:unit

  package:
    name: Package
    permissions:
      contents: read
      actions: read
    needs: [fast, check, native, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build exports
        run: |
          npm run build
          npm run build:distribution
      - name: Add native runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for runner in ubuntu-latest macos-latest windows-latest; do
            gh run download "$GITHUB_RUN_ID" --name "native-${runner}-${GITHUB_SHA}" --dir .eval-results/native
          done
          for target in claude codex cursor copilot gemini agents gemini-extension jetbrains distribution; do
            node tooling/native-install.mjs .eval-results/native "dist/$target"
          done
      - name: Validate exports
        run: npm run validate:exports
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-capabilities-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [check, package]
    if: github.repository == 'Aliaksie/engineering-pack' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: engineering-pack-distribution-next
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "craft-capabilities-${GITHUB_SHA}" --dir dist
      - name: Publish distribution-next
        run: node tooling/publish-distribution.mjs
        env:
          GH_TOKEN: ${{ github.token }}
