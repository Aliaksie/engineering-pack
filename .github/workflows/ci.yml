name: CI

on:
  push:
    branches: [main, perf/benchmark-matrix-2026-10-22]
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Run only the frozen performance benchmark matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    if: github.event.inputs.performance != 'true' && github.ref != 'refs/heads/perf/benchmark-matrix-2026-10-22'
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          mkdir -p "${RUNNER_TEMP}/actionlint"
          cd "${RUNNER_TEMP}/actionlint"
          curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" --output actionlint.tar.gz
          printf '%s  actionlint.tar.gz\n' "$ACTIONLINT_SHA256" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
      - name: Verify shell linter is available
        run: shellcheck --version
      - name: Lint workflows and verify invalid workflows are rejected
        run: |
          npm run lint:workflows
          npm run test:workflows

  check:
    if: github.event.inputs.performance != 'true' && github.ref != 'refs/heads/perf/benchmark-matrix-2026-10-22'
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '26'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Validate manifests, catalog and content audit
        run: npm run validate
      - name: Check generated guidance
        run: npm run check:craft-bar
      - name: Lint portable scripts
        run: npm run lint:scripts
      - name: Build all host packages
        run: npm run build
      - name: Assemble direct-install distribution
        run: npm run build:distribution
      - name: Validate generated exports
        run: npm run validate:exports
      - name: Run tests
        run: npm run test:unit
      - name: Measure local hook diagnostics
        run: npm run hooks:report -- --output .eval-results/hook-report.json
      - name: Upload hook diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-diagnostics-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: .eval-results/hook-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package host bundles
    needs: [check, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build packages
        run: |
          npm run build
          npm run build:distribution
      - name: Validate package output
        run: npm run validate:exports
      - name: Upload host bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craft-capabilities-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub installation branch
    needs: [check, package]
    if: github.event.inputs.performance != 'true' && github.repository == 'Aliaksie/engineering-pack' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: engineering-pack-distribution
      cancel-in-progress: false
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build installation branch
        run: npm run build:distribution
      - name: Publish generated files
        run: node tooling/publish-distribution.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  performance:
    name: Performance (${{ matrix.os }}, Node 24.21.0)
    if: (github.event_name == 'workflow_dispatch' && inputs.performance) || (github.event_name == 'push' && github.ref == 'refs/heads/perf/benchmark-matrix-2026-10-22')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out benchmark harnesses
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: benchmark
      - name: Check out frozen runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 49fd3841e0bee5e76639c07078e3ccfd5d330b68
          path: measured-source
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Run frozen portable workloads
        run: node benchmark/.github/benchmarks/run.mjs measured-source benchmark-results
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.os }}-node-24.21.0-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 14
