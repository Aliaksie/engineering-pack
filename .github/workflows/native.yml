name: Native runtime

on:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_INCREMENTAL: '0'

jobs:
  platform:
    name: Native (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, label: macos, runner: macos-15, target: aarch64-apple-darwin }
          - { os: windows-latest, label: windows, runner: windows-2022, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # These shells can resolve different tar implementations on Windows.
      - name: Release archives (Windows Bash)
        if: runner.os == 'Windows'
        run: |
          tar --version
          node --test tests/native-release.test.mjs
      - name: Release archives (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar --version
          node --test tests/native-release.test.mjs
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-native-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Clippy
        # Per platform: cfg(windows) and cfg(unix) code is only linted on its own target.
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Test Rust
        run: cargo test --workspace --locked --offline
      - name: Build exports
        run: |
          npm run build
          npm run build:distribution
      - name: Build release bundle
        run: npm run build:native
      - name: Select target
        env:
          EXPECTED_NATIVE_TARGET: ${{ matrix.target }}
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          test "$target" = "$EXPECTED_NATIVE_TARGET"
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          {
            echo "CRAFT_NATIVE_BINARY=$GITHUB_WORKSPACE/target/$target/release/craft$suffix"
            echo "CRAFT_PROJECT_EVIDENCE_BINARY=$GITHUB_WORKSPACE/target/$target/release/craft$suffix"
            echo "CRAFT_PROJECT_EVIDENCE_BUNDLE=$GITHUB_WORKSPACE/dist/project-evidence/$target"
          } >> "$GITHUB_ENV"
      - name: Test CLI and installed bundle
        run: npm run test:unit
      - name: Hook report
        run: npm run hooks:report -- --output .eval-results/hook-report.json
      - name: Upload hook report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-diagnostics-${{ matrix.os }}-node-24-${{ github.sha }}
          path: .eval-results/hook-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          path: dist/project-evidence/
          if-no-files-found: error
          retention-days: 14
