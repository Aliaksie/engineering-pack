name: Workflow validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          mkdir -p "${RUNNER_TEMP}/actionlint"
          cd "${RUNNER_TEMP}/actionlint"
          curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" --output actionlint.tar.gz
          printf '%s  actionlint.tar.gz\n' "$ACTIONLINT_SHA256" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
      - name: Check ShellCheck
        run: shellcheck --version
      - name: Lint workflows
        run: |
          npm run lint:workflows
          npm run test:workflows
