name: Security

on:
  workflow_call:
    inputs:
      skip-dependencies:
        description: Skip dependency checks when the caller already passed the fast gate
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 2'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies
    if: ${{ !inputs.skip-dependencies }}
    uses: ./.github/workflows/dependencies.yml

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
