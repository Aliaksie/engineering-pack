schema_version = "1.4"
# The repository with Craft's state; the verifier gets it in a fresh sandbox.
artifacts = ["/app"]

[task]
name = "craft/idle-one-file-question"
description = "One-file question: how many delivery attempts the retry helper makes by default."
keywords = ["developer", "probe-no-advantage"]

[metadata]
actor = "developer"
scenario = "No advantage: a question answered by reading one named file"
expected_mechanism = "Craft stays out of the way: the named file is read directly, no lookup or guidance reads"
answer_file = "ANSWER.md"

[agent]
timeout_sec = 300.0
user = "node"

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[environment]
network_mode = "public"
workdir = "/app"
cpus = 2
memory_mb = 4096
