schema_version = "1.4"
# The repository with Craft's state; the verifier gets it in a fresh sandbox.
artifacts = ["/app"]

[task]
name = "craft/idle-general-question"
description = "General question with no need for the repository: an HTTP status code."
keywords = ["developer", "probe-no-advantage"]

[metadata]
actor = "developer"
scenario = "No advantage: general knowledge, the repository is irrelevant"
expected_mechanism = "Craft stays silent: no repository exploration, lookup or guidance reads"
answer_file = "ANSWER.md"

[agent]
timeout_sec = 300.0
user = "node"

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[environment]
network_mode = "public"
workdir = "/app"
cpus = 2
memory_mb = 4096
