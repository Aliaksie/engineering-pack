[workspace]
members = ["engine", "platform", "application"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
getrandom = "=0.3.4"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
tree-sitter = "=0.27.1"
tree-sitter-javascript = "=0.25.0"
tree-sitter-java = "=0.23.5"

[workspace.lints.rust]
unsafe_code = "forbid"
