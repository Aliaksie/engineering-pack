[workspace]
members = ["engine", "platform", "application"]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
getrandom = "=0.4.3"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
tree-sitter = "=0.27.1"
tree-sitter-javascript = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.25.1"
tree-sitter-ruby = "=0.23.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# One executable ships in every package for every target: size over build time. Nothing
# catches an unwinding panic, and a hook command treats any crash exit as a crash.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
