<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1064" width="880" height="1064" role="img" aria-labelledby="t d">
<title id="t">One task with Craft 0.0.9</title>
<desc id="d">An agent adds discount codes to orders. Craft answers its search with the declaration and callers from the project index, reports an import that breaks the declared module dependencies and a test run that executed no test, asks before a .env file is read, holds a commit until the project's declared check has passed, reports a commit message that is not a Conventional Commit; it says nothing once each is fixed, refuses a forced push and ends the turn with one summary line.</desc>
<style>
text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#c9d1d9;white-space:pre}
.head{font-weight:600;fill:#f0f6fc}.sub,.who,.quiet{fill:#8b949e}.act{fill:#c9d1d9}.warn{fill:#e3b341}.deny{fill:#ff7b72}.good{fill:#7ee787}.info{fill:#79c0ff}
.scene{animation-duration:42.0s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes s0{0%,2.86%{opacity:0}3.81%,97%{opacity:1}100%{opacity:0}}
@keyframes s1{0%,10.48%{opacity:0}11.43%,97%{opacity:1}100%{opacity:0}}
@keyframes s2{0%,18.10%{opacity:0}19.05%,97%{opacity:1}100%{opacity:0}}
@keyframes s3{0%,25.71%{opacity:0}26.67%,97%{opacity:1}100%{opacity:0}}
@keyframes s4{0%,33.33%{opacity:0}34.29%,97%{opacity:1}100%{opacity:0}}
@keyframes s5{0%,40.95%{opacity:0}41.90%,97%{opacity:1}100%{opacity:0}}
@keyframes s6{0%,48.57%{opacity:0}49.52%,97%{opacity:1}100%{opacity:0}}
@keyframes s7{0%,56.19%{opacity:0}57.14%,97%{opacity:1}100%{opacity:0}}
@keyframes s8{0%,63.81%{opacity:0}64.76%,97%{opacity:1}100%{opacity:0}}
@keyframes s9{0%,71.43%{opacity:0}72.38%,97%{opacity:1}100%{opacity:0}}
@keyframes s10{0%,79.05%{opacity:0}80.00%,97%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.scene{animation:none}}
</style>
<rect width="880" height="1064" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="879" height="1063" rx="10" fill="none" stroke="#30363d"/>
<text x="24" y="30" class="head">One task: add discount codes to orders</text>
<text x="24" y="50" class="sub">Craft 0.0.9 answering Claude Code's hooks: its lines are its own output, no model involved.</text>
<g class="scene" style="animation-name:s0">
<text x="24" y="78"><tspan class="who">agent  </tspan><tspan x="84" class="act">Grep "total"</tspan></text>
<text x="24" y="96"><tspan class="who">craft  </tspan><tspan x="84" class="info">Project Intelligence for the search just run (verified declaration and callers, complete</tspan></text>
<text x="24" y="114"><tspan class="who"></tspan><tspan x="84" class="info">coverage; no authorization implied): {"question":"callers</tspan></text>
<text x="24" y="132"><tspan class="who"></tspan><tspan x="84" class="info">total","scopes":["."],"complete":true,"rows":["src/adapters/invoice.ts:2 in invoice: export</tspan></text>
<text x="24" y="150"><tspan class="who"></tspan><tspan x="84" class="info">const invoice = (lines: number[]) =&gt; ({ amount: total(lines)</tspan></text>
<text x="24" y="168"><tspan class="who"></tspan><tspan x="84" class="info">});"],"basis":"name","use":"Verified Project Intelligence rows from the current files with</tspan></text>
<text x="24" y="186"><tspan class="who"></tspan><tspan x="84" class="info">complete coverage of this scope: they answer this question without another search; name rows</tspan></text>
<text x="24" y="204"><tspan class="who"></tspan><tspan x="84" class="info">spell the asked name in syntax, not a resolved target","declaration":"src/domain/order.ts:1:</tspan></text>
<text x="24" y="222"><tspan class="who"></tspan><tspan x="84" class="info">export const total = (lines: number[]) =&gt; lines.reduce((a, b) =&gt; a + b, 0);"}</tspan></text>
</g>
<g class="scene" style="animation-name:s1">
<text x="24" y="250"><tspan class="who">agent  </tspan><tspan x="84" class="act">edit src/domain/order.ts          adds: import { db } from "../adapters/db"</tspan></text>
<text x="24" y="268"><tspan class="who">craft  </tspan><tspan x="84" class="warn">Project standards not met by what was just written (deterministic anchor check; report only,</tspan></text>
<text x="24" y="286"><tspan class="who"></tspan><tspan x="84" class="warn">fix or tell the user why not):</tspan></text>
<text x="24" y="304"><tspan class="who"></tspan><tspan x="84" class="warn">[{"standard":"rings","anchor":"hexagonal-architecture",</tspan></text>
<text x="24" y="322"><tspan class="who"></tspan><tspan x="84" class="warn">"findings":[{"rule":"undeclared-dependency","line":1,"message":"imports ../adapters/db from</tspan></text>
<text x="24" y="340"><tspan class="who"></tspan><tspan x="84" class="warn">module adapters; module domain does not declare dependsOn adapters"}]}]</tspan></text>
</g>
<g class="scene" style="animation-name:s2">
<text x="24" y="368"><tspan class="who">agent  </tspan><tspan x="84" class="act">edit src/domain/order.ts          removes the import</tspan></text>
<text x="24" y="386"><tspan class="who">craft  </tspan><tspan x="84" class="quiet">nothing to say</tspan></text>
</g>
<g class="scene" style="animation-name:s3">
<text x="24" y="414"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ node --test --test-name-pattern=discount</tspan></text>
<text x="24" y="432"><tspan class="who">craft  </tspan><tspan x="84" class="warn">Craft test evidence: the test command just run executed no test, so it verifies nothing (a</tspan></text>
<text x="24" y="450"><tspan class="who"></tspan><tspan x="84" class="warn">filter or skip matched everything). Run tests that exercise the change before reporting them</tspan></text>
<text x="24" y="468"><tspan class="who"></tspan><tspan x="84" class="warn">as passing: {"runner":"node","reason":"zero-tests","executed":0,"skipped":0,"command":"node</tspan></text>
<text x="24" y="486"><tspan class="who"></tspan><tspan x="84" class="warn">--test --test-name-pattern=discount"}</tspan></text>
</g>
<g class="scene" style="animation-name:s4">
<text x="24" y="514"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ cat .env</tspan></text>
<text x="24" y="532"><tspan class="who">craft  </tspan><tspan x="84" class="warn">Craft: `.env` commonly holds secrets (safety rule `read-secret-file`). Allow only if the</tspan></text>
<text x="24" y="550"><tspan class="who"></tspan><tspan x="84" class="warn">model should see its content.</tspan></text>
<text x="24" y="568"><tspan class="who">host   </tspan><tspan x="84" class="quiet">Claude Code asks you before the read; other hosts refuse it</tspan></text>
</g>
<g class="scene" style="animation-name:s5">
<text x="24" y="596"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ git commit -am 'fixed discounts'</tspan></text>
<text x="24" y="614"><tspan class="who">craft  </tspan><tspan x="84" class="deny">Craft holds this commit: the declared commit-stage check domain-1 covers changed files and</tspan></text>
<text x="24" y="632"><tspan class="who"></tspan><tspan x="84" class="deny">has not passed on the current files. Run `craft check --stage commit --session</tspan></text>
<text x="24" y="650"><tspan class="who"></tspan><tspan x="84" class="deny">demo-session-1`, fix what it reports, then commit. (routing.commitGate: false turns this</tspan></text>
<text x="24" y="668"><tspan class="who"></tspan><tspan x="84" class="deny">off.)</tspan></text>
</g>
<g class="scene" style="animation-name:s6">
<text x="24" y="696"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ craft check --stage commit --session demo-session-1</tspan></text>
<text x="24" y="714"><tspan class="who">craft  </tspan><tspan x="84" class="good">passed domain-1 (commit): node --test</tspan></text>
<text x="24" y="732"><tspan class="who"></tspan><tspan x="84" class="good">checks at commit: passed — 1 run, 1 passed, 0 not passed, 0 left to a later stage</tspan></text>
</g>
<g class="scene" style="animation-name:s7">
<text x="24" y="760"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ git commit -am 'fixed discounts'</tspan></text>
<text x="24" y="778"><tspan class="who">craft  </tspan><tspan x="84" class="warn">Project standards not met by what was just written (deterministic anchor check; report only,</tspan></text>
<text x="24" y="796"><tspan class="who"></tspan><tspan x="84" class="warn">fix or tell the user why not):</tspan></text>
<text x="24" y="814"><tspan class="who"></tspan><tspan x="84" class="warn">[{"standard":"commits","anchor":"conventional-commits","findings":[{"rule":"header",</tspan></text>
<text x="24" y="832"><tspan class="who"></tspan><tspan x="84" class="warn">"message":"the type must be followed by `: ` and a description","line":1}]}]</tspan></text>
</g>
<g class="scene" style="animation-name:s8">
<text x="24" y="860"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ git commit --amend -m 'feat(domain): add discount codes to orders'</tspan></text>
<text x="24" y="878"><tspan class="who">craft  </tspan><tspan x="84" class="quiet">nothing to say</tspan></text>
</g>
<g class="scene" style="animation-name:s9">
<text x="24" y="906"><tspan class="who">agent  </tspan><tspan x="84" class="act">$ git push --force origin main</tspan></text>
<text x="24" y="924"><tspan class="who">craft  </tspan><tspan x="84" class="deny">This project's safety policy refuses this command (rule `force-push`: a forced push, which</tspan></text>
<text x="24" y="942"><tspan class="who"></tspan><tspan x="84" class="deny">rewrites the remote branch). Do not reword it to get past the rule; tell the user what you</tspan></text>
<text x="24" y="960"><tspan class="who"></tspan><tspan x="84" class="deny">wanted to run and why, so they can run it themselves or change the request.</tspan></text>
</g>
<g class="scene" style="animation-name:s10">
<text x="24" y="988"><tspan class="who">host   </tspan><tspan x="84" class="act">the turn ends; shown to you, not to the model:</tspan></text>
<text x="24" y="1006"><tspan class="who">craft  </tspan><tspan x="84" class="good">Craft this session: 2 standards findings raised, 2 fixed · 1 test run that ran no test</tspan></text>
<text x="24" y="1024"><tspan class="who"></tspan><tspan x="84" class="good">caught · 1 lookup answered from the project index · 1 command refused by the safety policy</tspan></text>
</g>
</svg>
